<!DOCTYPE html>
<html lang="es" ng-app="tiendaApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda en línea</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body ng-controller="TiendaController">

  <!-- ===== BARRA SUPERIOR: nombre de la tienda y carrito ===== -->
  <nav class="navbar navbar-dark">
    <!-- PENDIENTE (Orlando): nombre definitivo de la tienda (vende libros) -->
    <span class="navbar-brand">Tienda en línea</span>

    <!-- Carrito arriba a la derecha con el total -->
    <!-- PENDIENTE (Josué): abrir el modal del carrito al hacer clic -->
    <button class="btn btn-carrito" type="button">
      🛒 Carrito: {{ totalCarrito() | currency:"$" }}
    </button>
  </nav>

  <!-- ===== SLIDER ===== -->
  <!-- PENDIENTE (Orlando): slider con al menos 3 imágenes (carousel de Bootstrap) -->

  <main class="container my-4">

    <!-- ===== FILTROS ===== -->
    <div class="barra-productos mb-4" ng-hide="cargando || error">
      <h2 class="barra-productos__titulo h4 mb-0">
        Productos de la categoría: <span class="barra-productos__categoria">{{ etiquetaCategoria() }}</span>
      </h2>
      <div class="barra-productos__controles">
        <input type="text" class="form-control busqueda-productos" ng-model="busqueda" placeholder="Buscar por nombre…" aria-label="Buscar productos por nombre">
        <select class="form-control barra-productos__select" ng-model="categoriaSeleccionada" aria-label="Filtrar por categoría">
          <option value="">Categoría</option>
          <option ng-repeat="cat in categorias" value="{{ cat }}">{{ cat }}</option>
        </select>
        <select class="form-control barra-productos__select" ng-model="opcionOrden" ng-change="actualizarOrden()" aria-label="Ordenar productos">
          <option value="nombre-asc">Nombre (A → Z)</option>
          <option value="nombre-desc">Nombre (Z → A)</option>
          <option value="precio-asc">Precio (menor a mayor)</option>
          <option value="precio-desc">Precio (mayor a menor)</option>
        </select>
      </div>
    </div>

    <!-- Mensajes mientras carga o si hay error -->
    <p class="text-muted" ng-show="cargando">Cargando productos...</p>
    <div class="alert alert-danger" ng-show="error">{{ error }}</div>

    <!-- ===== CARDS DE PRODUCTOS (se llenan con ng-repeat) ===== -->
    <div class="row" ng-hide="cargando || error">
      <div class="col-sm-6 col-md-4 col-lg-3 mb-4" ng-repeat="producto in productos | filter:filtroPorCategoria | filter:{title: busqueda} | orderBy:campoOrden:ordenInverso">
        <div class="card card-producto">
          <img ng-src="{{ producto.image }}" class="card-img-top" alt="{{ producto.title }}">
          <div class="card-body d-flex flex-column">
            <p class="categoria mb-1">{{ producto.category }}</p>
            <h3 class="card-title">{{ producto.title }}</h3>
            <p class="precio">{{ producto.price | currency:"$" }}</p>
            <button class="btn btn-outline-primary mt-auto" type="button" ng-click="verDetalles(producto)">Detalles</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== MODALES ===== -->
  <!-- PENDIENTE (José): modal de detalles del producto con botones Agregar y Cancelar -->
  <!-- PENDIENTE (Josué): modal del carrito con detalle, cantidad, total y botón Pagar -->

  <footer>Desafío Práctico 2 · Lenguajes Interpretados en el Cliente · UDB 2026</footer>

  <!-- jQuery y Bootstrap (para el slider y los modales) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- AngularJS -->
  <script src="https://cdn.jsdelivr.net/npm/angular@1.8.2/angular.min.js"></script>
  <!-- Archivos propios de la aplicación -->
  <script src="js/app.js"></script>
  <script src="js/productoService.js"></script>
  <script src="js/tiendaController.js"></script>
</body>
</html>
